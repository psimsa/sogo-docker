# Main nginx configuration for the SOGo container.
#
# nginx runs fully unprivileged (as user "sogo"): the pid file and per-worker
# temp directories live in /tmp, and logs go to the container's stdout/stderr.

daemon              off;
pid                 /tmp/nginx.pid;

error_log           /dev/stderr warn;

worker_processes    auto;

events {
    worker_connections 1024;
}

http {
    include         /etc/nginx/mime.types;
    default_type    application/octet-stream;

    access_log      /dev/stdout;
    error_log       /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65s;
    server_tokens   off;

    # Unprivileged temp paths (the compiled-in defaults point to
    # /var/lib/nginx, which is only writable by root).
    client_body_temp_path  /tmp/nginx/client_body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    # Compress text assets (the web UI's JS/CSS benefit the most).
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    include /etc/nginx/conf.d/*.conf;
}
