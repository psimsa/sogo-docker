# SOGo virtual host.
#
# - serves the static web UI resources (WebServerResources) from disk
# - proxies /SOGo and /Microsoft-Server-ActiveSync to sogod on localhost
# - works behind Traefik (or any reverse proxy that sets X-Forwarded-Proto /
#   X-Forwarded-Port and preserves the Host header), and also when reached
#   directly on port 8080.
#
# Mount your own file at /etc/nginx/conf.d/sogo.conf to customise.

# Scheme as seen by the browser: honour X-Forwarded-Proto from the reverse
# proxy in front of this container, fall back to our own scheme otherwise.
map $http_x_forwarded_proto $sogo_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Port as seen by the browser: Traefik sets X-Forwarded-Port; when reached
# directly, the port is the one nginx listens on.
map $http_x_forwarded_port $sogo_ext_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

upstream sogod {
    server 127.0.0.1:20000;
}

server {
    listen 8080;
    server_name _;

    # SOGo's web UI uploads mail attachments — do not limit the body size
    # here (enforce limits at the reverse proxy if required).
    client_max_body_size 0;

    # Don't send the Referer header cross-origin (mirrors Apache/SOGo.conf).
    add_header Referrer-Policy "same-origin" always;

    # ---- redirects ----------------------------------------------------------

    # "/"" -> web UI (absolute, so the external scheme/host/port are kept —
    # a plain "return 302 /SOGo" would bake in nginx's internal 8080 port)
    location = / {
        return 302 $sogo_scheme://$http_host/SOGo;
    }

    # Apple CalDAV/CardDAV autoconfiguration
    location ~ ^/\.well-known/(caldav|carddav)/?$ {
        return 301 $sogo_scheme://$http_host/SOGo/dav;
    }

    # ---- static web UI resources ---------------------------------------------
    # URL-cacheable for a year: a resource's URL must change for clients to
    # pick up a new version (mirrors Apache/SOGo.conf).

    location ^~ /SOGo.woa/WebServerResources/ {
        alias /usr/local/lib/GNUstep/SOGo/WebServerResources/;
        access_log off;
        expires 365d;
    }

    location ^~ /SOGo/WebServerResources/ {
        alias /usr/local/lib/GNUstep/SOGo/WebServerResources/;
        access_log off;
        expires 365d;
    }

    # ---- Microsoft Exchange ActiveSync ----------------------------------------
    # ActiveSync clients keep a single request open for a long time (push
    # notifications); the long timeouts below mirror Apache/SOGo.conf.
    location /Microsoft-Server-ActiveSync {
        proxy_pass http://sogod/SOGo/Microsoft-Server-ActiveSync;

        include /etc/nginx/sogo-proxy-params.conf;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       off;
    }

    # ---- everything else goes to sogod -----------------------------------------
    location /SOGo {
        proxy_pass http://sogod;

        include /etc/nginx/sogo-proxy-params.conf;

        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Don't cache dynamic content (mirrors Apache/SOGo.conf). Note:
        # add_header in a location clears inherited headers, hence the
        # Referrer-Policy repetition.
        add_header Cache-Control "max-age=0, no-cache, no-store" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
