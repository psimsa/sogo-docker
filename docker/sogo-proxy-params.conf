# Shared proxy settings for passing requests from nginx to sogod.
#
# Included from /etc/nginx/conf.d/sogo.conf (valid in a `location` context
# only — do NOT include this file from the http context).

# Preserve the original Host (SOGo uses the x-webobjects-* headers below for
# URL generation, but Host is kept for logging and DAV clients).
proxy_set_header Host              $http_host;

# Standard forwarding headers; sogod derives the client address from
# X-Forwarded-For.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $sogo_scheme;

# ---- SOGo adaptor headers (see Apache/SOGo.conf shipped with SOGo) --------
# sogod builds absolute URLs (links in invitation emails, redirects, DAV
# principal URLs, ...) from these headers. $sogo_scheme / $sogo_ext_port are
# mapped in /etc/nginx/conf.d/sogo.conf from X-Forwarded-Proto/-Port, so they
# reflect what the browser used, even when this container sits behind Traefik
# or another reverse proxy over plain HTTP.
proxy_set_header x-webobjects-server-name $host;
proxy_set_header x-webobjects-server-port $sogo_ext_port;
proxy_set_header x-webobjects-server-url  $sogo_scheme://$http_host;

# The following headers carry authentication results. They are only ever set
# by the proxy itself — never accept them from the outside world.
proxy_set_header x-webobjects-remote-user "";
proxy_set_header x-webobjects-auth-type   "";
proxy_set_header x-webobjects-remote-host "";
proxy_set_header x-webobjects-adaptor-prefix "";
