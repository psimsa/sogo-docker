name: Build Docker Image

on:
  push:
    branches: [main]
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ vars.GHCR_PUSH == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # On a tag - strip leading 'v' if present
            TAG="${{ github.ref_name }}"
            TAG_VALUE="${TAG#v}"
            echo "primary=${TAG_VALUE}" >> $GITHUB_OUTPUT
            echo "extra=latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # On main branch - use run number for uniqueness
            echo "primary=${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          ./build.sh
        env:
          IMAGE: "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.primary }}"

      - name: Add extra tags
        if: steps.tags.outputs.extra != ''
        run: |
          docker tag "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.primary }}" "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.extra }}"

      - name: Push Docker image
        if: ${{ vars.GHCR_PUSH == 'true' }}
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.primary }}"
          if [ -n "${{ steps.tags.outputs.extra }}" ]; then
            docker push "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.extra }}"
          fi
